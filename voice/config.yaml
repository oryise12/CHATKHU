# 음성 경로 수정 도우미 설정. python3 -m voice --config 다른파일.yaml 로 바꿔 쓸 수 있다.
# API 키는 여기에 넣지 않는다. 환경변수 BAZE_API_KEY에서만 읽는다.

wake_word: 쿠옹아
# 음성 자막에서 호출어가 다르게 적히는 표기 (manipulator 쿠옹이의 실제 마이크 실측 목록과 같다).
# 문장 맨 앞 두 단어 안에서만 찾으므로 짧은 표기도 문장 중간 말에는 걸리지 않는다.
wake_aliases: [쿠옹, 쿠옹이, 쿠옹이야, 쿠엉아, 쿠엉, 쿠오나, 쿠오아, 쿠오가, 꾸옹아, 궁아, 공아, kuong, kuonga,
               구홍아, 구공아, 구옹아, 궁어, 구운화, 구웅아, 공화, 궁화, 푸옹아, 붕어, 콩아, 부엉아]
# 문장 첫 단어가 호출어와 첫 글자만 다를 때도 호출어로 본다
wake_fuzzy: true
# 다른 말 없이 이 말 한 마디만 하면 부른 것으로 본다 (예: [야]). 옆 사람의 "야"에 열리지 않게 기본은 끔
call_words: []
# 호출어를 들은 뒤 이 시간(초) 안에는 호출어 없이 말해도 된다. 명령이 실제로 실행되거나 손으로 고칠 때만
# 다시 채운다 (옆 사람 말, 거절된 말로는 늘지 않는다). 0 = 한 번 부르면 쿠옹이를 끌 때까지 계속 연다.
# 2026-10-28 사용자 결정: 0 (돌아오는 길을 고칠 때 다시 부르지 않게). 옆 사람 말도 명령으로 받을 수 있다.
wake_seconds: 0
# false = 호출어 없이 처음부터 듣는다 (2026-10-29 사용자 결정: 음성 자막이 "쿠옹아"를 자주 못 알아들음).
# 옆 사람 말, 혼잣말도 들린다. 움직이기 전에는 늘 "검증 후 이동할까요?"에 그렇다고 답해야 한다.
wake_required: false
# 앱이 질문하면("계속 갈까요, 돌아갈까요?") 이 시간(초) 안의 답 한 번은 호출어 없이 받는다. 그 질문의 답이 되는
# 함수만 실행하고, 그 사이 시뮬레이터 상태가 바뀌면 질문은 지난 것으로 본다
answer_seconds: 20

model: gemini-3.8-live
# AI 목소리 (Gemini 기본 목소리 이름: Kore, Puck, Charon, Aoede, Fenrir, Leda, Orus, Zephyr 등)
voice: Kore

# 지시문 파일. 버전을 바꿔 가며 비교한다 (기록에 파일 이름이 남는다)
prompt: prompts/system_v1.md
# 말투 지시문 (지시문의 {style} 자리에 들어간다)
style: 차분하고 짧은 존댓말로 말한다.

# 얼마나 → 옮기는 거리(cm). 가짜 결과에 넣어 돌려준다
amount_cm:
  small: 2
  medium: 5
  large: 8

# 시험용 실패 모드. 켜면 수정 함수가 {"status":"failed","reason":...}을 돌려준다
fail_mode: false
fail_reason: unreachable

# 마이크 (번호 또는 이름 일부, 비우면 운영체제 기본 입력)
mic: ""
# AI가 말하는 동안 마이크 소리 대신 무음을 보낸다 (스피커 소리를 다시 듣지 않게)
mute_mic_while_speaking: true
# 로봇(시뮬레이터)이 움직이는 동안에는 AI가 말해도 마이크를 연다 ("멈춰"를 놓치지 않게).
# ⚠️ 스피커 소리가 다시 들려 쿠옹이가 자기 말에 끊기거나 명령으로 오인할 수 있다. 실제 마이크·스피커로
#    docs/PINCH_KHU_SETUP.md의 "음성 정지 현장 시험"을 통과한 뒤에만 켠다. 그 전에는 X 키가 확실한 정지 수단이다.
listen_while_moving: false

# 대화 기록(JSONL) 폴더
log_dir: logs
