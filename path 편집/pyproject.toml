[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-path-editor"
version = "0.1.0"
description = "Pure Python round-trip 3D path editing prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
webcam = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86"]

[project.scripts]
pac-path-editor = "pac_path_editor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
