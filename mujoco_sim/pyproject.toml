[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinch-sim"
version = "0.1.0"
description = "MuJoCo 6-DOF arm: initial path -> selection -> validation -> approval -> torque-controlled execution"
requires-python = ">=3.10"
dependencies = ["mujoco==3.15.0", "numpy>=1.26,<2", "scipy>=1.11", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
