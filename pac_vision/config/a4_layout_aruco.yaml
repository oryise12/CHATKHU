# 기준물이 ArUco 보정판(A4 한 장에 마커 4개)일 때의 배치 (python scripts/calibrate.py --layout aruco).
# 클릭 대신 정지 화면에서 마커 4개를 찾아 각 마커 중심(대각선 교점)을 기준점으로 쓴다. 계산·검사는 클릭과 같다.
# 인쇄물: python tools/make_aruco_board.py board.pdf (이 파일의 sheet·aruco 값으로 만든다, 실제 크기 100 % 인쇄).
#
# 좌표계는 a4_layout_single.yaml과 같다 (base_ref, m, 책상 z = 0):
# - 원점 = 로봇 베이스 중심. 화면에서 종이의 긴 변 1-2(로봇 쪽) 가운데에서 종이 바깥쪽으로 9 cm.
# - +Y = 베이스에서 종이 가운데를 보는 방향 (로봇의 앞, 시뮬레이터 world +Y).
# - +X = Y × Z: 로봇의 오른쪽 = 화면에서 꼭짓점 2(우상) → 1(좌상) 쪽.
# 보정판은 지금 A4 자리에 가로로 놓는다: 인쇄된 화살표("로봇 쪽")가 로봇을 보게, ID 1·2·3·4가 꼭짓점 1·2·3·4 쪽.

base_clicked: false
base_point: [0.0, 0.0, 0.0]          # 로봇 베이스 중심 (찍지 않음)

# 마커 중심, ID 순서대로 (= 꼭짓점 1 좌상, 2 우상, 3 좌하, 4 우하 쪽)
corners:
  - [ 0.0925, 0.1425, 0.0]   # ID 1: 좌상 (로봇 쪽)
  - [-0.0925, 0.1425, 0.0]   # ID 2: 우상 (로봇 쪽)
  - [ 0.0925, 0.2475, 0.0]   # ID 3: 좌하
  - [-0.0925, 0.2475, 0.0]   # ID 4: 우하

# 마커 중심 사각형의 테두리 순서 (위에서 볼 때 반시계, 번호): 1 → 3 → 4 → 2
cycle: [1, 3, 4, 2]
click_names: ["마커 1 (좌상)", "마커 2 (우상)", "마커 3 (좌하)", "마커 4 (우하)"]
shape_name: "마커 중심 사각형"
# 마커 중심 사각형은 A4보다 작다(10.5 x 18.5 cm). 자동 검출 오차는 1 px보다 훨씬 작아서 화면 크기 기준을 낮춘다.
short_side_min_px: 40

# 재점검(--check) 때 클릭할 점: 마커 3 중심
recheck_corner: 3

aruco:
  dictionary: DICT_4X4_50
  ids: [1, 2, 3, 4]          # corners 순서의 마커 번호
  size_m: 0.095              # 검은 정사각형 한 변
  min_side_px: 30            # 화면에서 이보다 작게 보이는 마커는 쓰지 않는다 (검출이 흔들림)

# 인쇄물 (tools/make_aruco_board.py): A4 가로. 종이 좌상 모서리(꼭짓점 1)가 base 좌표 corner1_m에 온다.
# 마커끼리 붙이면 검은 테두리가 합쳐져 하나도 검출되지 않는다 (2026-10-26 시험). 사이를 띄운다:
# 짧은 변 방향 여백 5 + 마커 95 + 사이 10 + 마커 95 + 여백 5 = 210 mm,
# 긴 변 방향 여백 8.5 + 마커 95 + 사이 90 + 마커 95 + 여백 8.5 = 297 mm.
sheet:
  size_m: [0.297, 0.210]     # 긴 변(꼭짓점 1 → 2), 짧은 변(꼭짓점 1 → 3)
  corner1_m: [0.1485, 0.090, 0.0]
  u_dir: [-1.0, 0.0]         # 인쇄물 가로(꼭짓점 1 → 2)의 base 방향
  v_dir: [0.0, 1.0]          # 인쇄물 세로(꼭짓점 1 → 3, 로봇에서 멀어지는 쪽)의 base 방향
