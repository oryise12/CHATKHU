# 캘리브레이션 기준물 배치. base_ref 좌표 (m), REP-103: +X 앞, +Y 왼쪽, +Z 위. 책상면 z = 0.
# 기준물: A4 두 장을 긴 변끼리 끝을 맞춰 뒤에서 테이프로 이어 붙인다 (틈 없이). 줄자는 쓰지 않는다.
# - 대각선 종이: 대각선 두 개의 교차점 = base (0, 0, 0). X 화살표는 교차점을 지나 긴 변과 평행, 앞쪽(+X).
# - 맞댄 종이: 대각선 종이의 왼쪽(+Y) 긴 변에 붙인다.
# - 꼭짓점 1-4는 두 장을 합친 직사각형(29.7 x 42.0 cm)의 바깥 꼭짓점. 종이 꼭짓점 안쪽에 1-4를 크게 적는다.
# - 이음매 양 끝 S1 (0.1485, 0.105, 0), S2 (-0.1485, 0.105, 0)은 계산에 쓰지 않고 --check 검증점으로 쓴다.

base_point: [0.0, 0.0, 0.0]

# 위에서 볼 때 반시계 순서. 클릭 순서는 base → 꼭짓점 1 → 2 → 3 → 4
corners:
  - [-0.1485, -0.105, 0.0]   # 꼭짓점 1: 대각선 종이 뒤-오른쪽
  - [ 0.1485, -0.105, 0.0]   # 꼭짓점 2: 대각선 종이 앞-오른쪽
  - [ 0.1485,  0.315, 0.0]   # 꼭짓점 3: 맞댄 종이 앞-왼쪽
  - [-0.1485,  0.315, 0.0]   # 꼭짓점 4: 맞댄 종이 뒤-왼쪽

# 재점검용 테이프를 붙일 꼭짓점 번호 (로봇 작업 영역 밖의 꼭짓점, 로봇 뒤-왼쪽)
recheck_corner: 4
