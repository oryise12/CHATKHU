# 시연 지점 (mujoco_sim pinch_sim --stations, stations.py). 2026-10-29 사용자 결정 (S 높이 0.20 → 0.12 m 같은 날 변경).
# 마커는 ArUco 4x4(DICT_4X4_50). 1~4번은 보정판, 5번은 카메라 정합 확인용이라 쓰지 않는다.
# 실제 그릇은 두지 않고 마커만 보인다. 위치는 시뮬이 켜질 때 카메라로 한 번 읽는다(팔이 가리기 전).
# height_m: 그 지점의 목표 높이(그리퍼 끝, 책상면 기준 m). 직선 경로는 이 점들 사이에 그린다.
# 카메라 없이 시험할 때만 base_m: [x, y] (보정 좌표계 m)을 넣는다.
dictionary: DICT_4X4_50
frames: 20          # 마커마다 이만큼의 영상에서 찾은 위치의 중앙값
dip_m: 0.05         # 그릇·바구니에 도착하면 이만큼 내려가서 그대로 있는다 (처음 HOME -> S는 안 내려감). 다음 이동은
                    # 먼저 목표 높이로 올라간 뒤 출발한다. 0 = 끔
stations:
  S: {marker: 6, label: 설거지 바구니, height_m: 0.12}
  B: {marker: 7, label: 국그릇, height_m: 0.12}
  C: {marker: 8, label: 밥그릇, height_m: 0.12}
