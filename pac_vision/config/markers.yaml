# 고정 표지(ArUco). 현장 값 (지금 시연 배치, 저장소에 포함). 형식은 markers.example.yaml.
# 좌표계: 보정(a4_layout_aruco) base_ref = 원점 로봇 베이스 중심(J1 축), +Y 베이스 → 종이 가운데, +X = 로봇의 오른쪽
#         (꼭짓점 2 → 1 방향), 책상 z = 0.
# 2026-10-28 사용자 결정: 표지 하나, 4x4 5번 50 mm (5–8번 시트에서 잘라 씀).
#   처음 자리: 로봇 판의 앞 왼쪽 모서리 (-0.09, 0.09)에 표지 모서리를 맞춤 → 중심 (-0.115, 0.065).
#   2026-10-28 현장 영상: 그 자리에서는 표지 한 변이 판 옆면에 붙어 흰 여백이 없고(판의 어두운 옆면과 테두리가 이어짐),
#   보정판 2번과도 5 mm라 검출되지 않았다. → 판 옆면에서 15 mm, 종이 변에서 10 mm 띄운 자리로 옮긴다:
#   표지 변 x -0.105 ~ -0.155, y 0.030 ~ 0.080 → 중심 (-0.130, 0.055), z = 0 (책상면).
#   2026-10-28 21:4x 재배치 PC: 21:39 보정(cam2base)으로 표지 중심을 100프레임 잼 → (-0.1266, 0.0654), 흔들림 0 mm.
#   이전 값과 +Y 10 mm 차이로 표지 검사가 10.4–10.8 mm(허용 10)라 그 값으로 바꿈. 줄자로 잰 값이 아니라 보정에서 얻은 값이다.
#   보이는 표지 1개로 검증(min_visible: 1). 그 표지를 축으로 한 카메라 회전은 못 잡고, 5초 넘게 가리면 3D 핀치가 멈춘다.
# 이전 설정(0·1번 12 cm, 붙인 적 없음, 보정판 1번과 번호 겹침)은 markers.yaml.bak.
dictionary: DICT_4X4_50
size_m: 0.05
min_visible: 1
max_pixel_px: 8.0
max_desk_mm: 10.0
markers:
  5: {base_m: [-0.127, 0.065, 0.0]}
