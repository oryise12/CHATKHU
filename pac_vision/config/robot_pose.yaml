# 로봇 위치 (현장 값, 지금 시연 배치, 저장소에 포함). 보정(a4_layout_single / a4_layout_aruco): base_ref 원점 = 로봇 베이스 중심(J1 축),
# +Y = 베이스에서 종이 가운데를 보는 방향.
# 시뮬레이터 약속: (x_m, y_m) = base_link 원점의 base_ref 위치, yaw_deg = 로봇 모델 +Y가 +X에서 반시계로 이룬 각.
# 2026-10-26: 실물은 모델 -Y 쪽에서 일한다(실물 HOME = 시뮬 ready의 좌우 반대, 보정 자세에서 아래팔이 종이 쪽).
#   그래서 모델 -Y가 종이 쪽(+Y) = yaw -90. J1 축은 base_link 원점보다 모델 +Y로 2.984 mm -> 이 yaw에서 y_m = +0.003.
#   이전 값(yaw 90, y -0.003: 시뮬 데모가 +Y에서 일하던 가정)은 robot_pose.yaml.bak.
x_m: 0.0
y_m: 0.003
yaw_deg: -90.0
