# 기준물이 A4 한 장일 때의 배치 (python scripts/calibrate.py --layout single). 꼭짓점 4개만 클릭한다 (원점은 찍지 않음).
# base_ref 좌표 (m), +Z 위, 책상 z = 0. 원점과 축은 로봇 베이스 기준:
# - 원점 = 로봇 베이스 중심. 화면에서 긴 변 1-2의 가운데에서 종이 바깥쪽(위쪽)으로 9 cm.
# - +Y = 베이스에서 종이 가운데를 보는 방향 (= 로봇의 앞, 시뮬레이터 world +Y와 같다).
# - +X = Y × Z (오른손 좌표): 로봇이 +Y를 볼 때 로봇의 오른쪽 = 화면에서 2(우상) → 1(좌상) 쪽.
#   그래서 이 보정의 base_ref는 시뮬레이터 world와 같은 축이고, 로봇 위치는 robot_pose.yaml의 yaw 90° (원점에 서서 +Y를 봄).
# 클릭 순서와 위치 (카메라 화면 기준): 1 좌상, 2 우상, 3 좌하, 4 우하. 1-2와 3-4가 긴 변(29.7 cm), 1-3과 2-4가 짧은 변(21.0 cm).
# 두 장(a4_layout.yaml)보다 기준이 작아 회전 오차가 커진다.

base_clicked: false
base_point: [0.0, 0.0, 0.0]          # 로봇 베이스 중심 (찍지 않음)

# 클릭 순서대로: 1 좌상, 2 우상, 3 좌하, 4 우하
corners:
  - [ 0.1485, 0.090, 0.0]   # 꼭짓점 1: 좌상 (긴 변 1-2, 베이스 쪽)
  - [-0.1485, 0.090, 0.0]   # 꼭짓점 2: 우상
  - [ 0.1485, 0.300, 0.0]   # 꼭짓점 3: 좌하 (긴 변 3-4, 베이스 반대쪽)
  - [-0.1485, 0.300, 0.0]   # 꼭짓점 4: 우하

# 종이 테두리 순서 (위에서 볼 때 반시계, 클릭 번호): 1 → 3 → 4 → 2
cycle: [1, 3, 4, 2]
click_names: ["꼭짓점 1 (좌상)", "꼭짓점 2 (우상)", "꼭짓점 3 (좌하)", "꼭짓점 4 (우하)"]

# 재점검용 테이프를 붙일 꼭짓점 번호
recheck_corner: 3
