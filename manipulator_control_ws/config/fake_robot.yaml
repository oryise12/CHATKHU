# 가상(fake_bus) 전용 설정. 아래 값은 시험용으로 지어낸 값이며 실물 측정값이 아니다.
# 실기 실행은 config/robot.yaml만 읽는다. 이 파일의 값을 robot.yaml로 옮기지 않는다.
schema: 1
kind: fake

bus:
  port: fake
  baudrate: 1000000
  protocol: 2.0
  model_number: 1030

servo_expect:
  operating_mode: 4
  allow_operating_mode_write: true
  drive_mode: 0
  startup_configuration: 0
  status_return_level: 2
  bus_watchdog: 0
  voltage_v: [11.4, 12.8]
  max_temperature_c: 55

model:
  viz_mjcf: models/derived/viz_scene.xml

joints:   # FAKE values
  - {name: Revolute_1, id: 1, gear_ratio: 16, sign: 1,  q_ref_deg: 0.0,   limit_deg: [-90, 90]}
  - {name: Revolute_2, id: 2, gear_ratio: 16, sign: -1, q_ref_deg: 0.0,   limit_deg: [-20, 100]}
  - {name: Revolute_3, id: 3, gear_ratio: 16, sign: 1,  q_ref_deg: 0.0,   limit_deg: [-20, 120]}
  - {name: Revolute_4, id: 4, gear_ratio: 16, sign: 1,  q_ref_deg: 0.0,   limit_deg: [-100, 30]}
  - {name: Revolute_5, id: 5, gear_ratio: 16, sign: -1, q_ref_deg: 0.0,   limit_deg: [-120, 30]}
  - {name: Revolute_6, id: 6, gear_ratio: 16, sign: 1,  q_ref_deg: 0.0,   limit_deg: [-90, 90]}

reference:
  note: "FAKE: q = 0 (arm straight up)"

home:
  q_rad: [0.0, 0.641283, 1.312362, -0.899717, -1.570796, -0.139769]
  source: "sim ready (FAKE run)"

fake:
  # power-on raw positions (one servo turn, as after a power cycle) and the extra counts the "hand" moved the
  # joints by before the user pressed Enter (so P_ref is a multi-turn value, incl. negative)
  power_on_counts: [1200, 3900, 50, 2048, 4000, 700]
  aligned_offset_counts: [0, -70000, 9000, 0, -4096, 12000]
  sag_counts_per_s: [0, 30, 20, 5, 0, 0]   # drift with torque off (gravity), counts/s
